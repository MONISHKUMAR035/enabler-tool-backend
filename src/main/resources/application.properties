# server port (platform sets PORT automatically)
server.port=${PORT:8080}

# -------------------------
# DATABASE (single expression)
# Prefer a full JDBC URL env var (JDBC_DATABASE_URL). If not present,
# try MYSQL_URL or DATABASE_URL. If none present, compose from parts.
# -------------------------
spring.datasource.url=${JDBC_DATABASE_URL:${MYSQL_URL:${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:employeestatus_balance}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}}}
spring.datasource.username=${DB_USER:${MYSQL_USER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:Monishkumar@035}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=-1

